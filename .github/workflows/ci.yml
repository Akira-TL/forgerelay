name: CI

on:
  workflow_call:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      FORGERELAY_ALLOWED_ROOTS: ${{ github.workspace }}
      FORGERELAY_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      FORGERELAY_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure search tools on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep fd

      - name: Release metadata
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Optional LSP interoperability
        run: npm run lsp:interop

      - name: Doctor
        run: node dist/cli.js doctor
