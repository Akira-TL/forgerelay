name: CI

on:
  workflow_call:

jobs:
  core-contract:
    name: Core contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:contract

  core-tests:
    name: Core tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - runtime-config
          - workspace-lifecycle
          - workspace-state
          - mcp-core
          - mcp-server-ui
          - lsp
          - subagent
          - ui-cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:test-shard -- ${{ matrix.shard }}

  package:
    name: Build verified npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build
      - run: npm run lsp:interop
        timeout-minutes: 5
      - run: npm run release:pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: .release-artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  traffic-audit:
    name: Traffic audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build:app
      - run: npm run traffic:audit
        timeout-minutes: 8

  linux-product:
    name: Linux product acceptance
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - run: npm run config:product-accept
        timeout-minutes: 8

  macos-platform:
    name: macOS platform tests
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:platform-tests
        timeout-minutes: 8

  macos-product:
    name: macOS product acceptance
    needs: package
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - run: npm run config:product-accept
        timeout-minutes: 8

  windows-platform:
    name: Windows platform tests (${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime-process, workspace-filesystem]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:platform-tests -- ${{ matrix.shard }}
        timeout-minutes: 8

  windows-product:
    name: Windows product acceptance
    needs: package
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - run: npm run ci:prepare-windows-product
        timeout-minutes: 5
      - run: npm run windows:product-accept
        timeout-minutes: 8

  windows-shell:
    name: Windows shell acceptance (${{ matrix.name }})
    needs: package
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            script: pwsh:accept
          - name: Windows PowerShell 5.1
            script: powershell51:accept
          - name: cmd.exe
            script: cmd:accept
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - run: npm run ci:prepare-windows-product
        timeout-minutes: 5
      - run: npm run ${{ matrix.script }}
        timeout-minutes: 5
