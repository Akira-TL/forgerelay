name: CI

on:
  workflow_call:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # better-sqlite3 native installation still relies on node-gyp, which Node 22/npm currently cannot discover on the VS18 windows-latest image.
          - windows-2022

    env:
      FORGERELAY_ALLOWED_ROOTS: ${{ github.workspace }}
      FORGERELAY_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      FORGERELAY_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run ci:verify

      - name: Pack verified npm artifact
        if: runner.os == 'Linux'
        run: npm run release:pack

      - name: Upload verified npm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: .release-artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7
