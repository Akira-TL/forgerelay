name: CI

on:
  workflow_call:

jobs:
  core-contract:
    name: Core contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:contract

  core-tests:
    name: Core tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - runtime-config
          - workspace-lifecycle
          - workspace-state
          - mcp-core
          - mcp-server-ui
          - lsp
          - subagent
          - ui-cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:test-shard -- ${{ matrix.shard }}

  package:
    name: Build verified npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build
      - run: npm run lsp:interop
        timeout-minutes: 5
      - run: npm run release:pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: .release-artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  traffic-audit:
    name: Traffic audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build:app
      - run: npm run traffic:audit
        timeout-minutes: 8

  linux-product:
    name: Linux product acceptance
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - run: npm run config:product-accept
        timeout-minutes: 8

  macos-platform:
    name: macOS platform tests
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:platform-tests
        timeout-minutes: 8

  macos-product:
    name: macOS product acceptance
    needs: package
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - run: npm run config:product-accept
        timeout-minutes: 8

  windows-platform:
    name: Windows platform tests (${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime-process, workspace-filesystem]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: windows-platform-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: windows-platform-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-npm-11.19.1-${{ hashFiles('package-lock.json') }}
      - if: steps.windows-platform-deps.outputs.cache-hit != 'true'
        run: npx --yes npm@11.19.1 ci --no-audit --no-fund
      - run: npx --yes npm@11.19.1 run ci:platform-tests -- ${{ matrix.shard }}
        timeout-minutes: 8

  windows-product:
    name: Windows product acceptance
    needs: package
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: windows-npm-cli
        uses: actions/cache@v4
        with:
          path: .ci-npm-global
          key: windows-npm-cli-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-npm-11.19.1
      - if: steps.windows-npm-cli.outputs.cache-hit != 'true'
        run: npm install --global --prefix .ci-npm-global npm@11.19.1 --no-audit --no-fund --prefer-offline
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - run: node .ci-npm-global/node_modules/npm/bin/npm-cli.js run ci:prepare-windows-product
        timeout-minutes: 5
      - run: node .ci-npm-global/node_modules/npm/bin/npm-cli.js run windows:product-accept
        timeout-minutes: 8

  windows-shell:
    name: Windows shell acceptance (${{ matrix.name }})
    needs: package
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            script: pwsh:accept
          - name: Windows PowerShell 5.1
            script: powershell51:accept
          - name: cmd.exe
            script: cmd:accept
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-package
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed
      FORGERELAY_ACCEPTANCE_RUNTIME_ROOT: .release-runtime
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: windows-shell-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: windows-platform-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-npm-11.19.1-${{ hashFiles('package-lock.json') }}
      - id: windows-npm-cli
        uses: actions/cache@v4
        with:
          path: .ci-npm-global
          key: windows-npm-cli-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-npm-11.19.1
      - if: steps.windows-npm-cli.outputs.cache-hit != 'true'
        run: npm install --global --prefix .ci-npm-global npm@11.19.1 --no-audit --no-fund --prefer-offline
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: .release-package
      - if: steps.windows-shell-deps.outputs.cache-hit == 'true'
        run: node .ci-npm-global/node_modules/npm/bin/npm-cli.js run ci:prepare-windows-shell-runtime
        timeout-minutes: 2
      - if: steps.windows-shell-deps.outputs.cache-hit != 'true'
        run: node .ci-npm-global/node_modules/npm/bin/npm-cli.js run ci:prepare-windows-product
        timeout-minutes: 5
      - run: node .ci-npm-global/node_modules/npm/bin/npm-cli.js run ${{ matrix.script }}
        timeout-minutes: 5
