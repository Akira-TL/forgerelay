name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Cloud CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish npm and GitHub Release
    needs: verify
    if: github.repository == 'Akira-TL/forgerelay'
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        run: npm run release:tag-check -- "$GITHUB_REF_NAME"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build publish artifact
        run: npm run build

      - name: Inspect published package
        run: npm pack --dry-run

      - name: Check npm publication state
        id: npm-state
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with bootstrap token
        if: steps.npm-state.outputs.published != 'true' && env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag latest

      - name: Publish to npm with Trusted Publishing
        if: steps.npm-state.outputs.published != 'true' && env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public --tag latest

      - name: Prepare GitHub Release notes
        shell: bash
        run: node scripts/release-version.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
