name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Cloud CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish verified npm artifact
    needs: verify
    if: github.repository == 'Akira-TL/forgerelay'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_PACKAGE_DIR: .release-package

    steps:
      - name: Checkout verified release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use pinned publishing npm
        run: npm install --global npm@11.19.1

      - name: Download verified npm artifact
        uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: .release-package

      - name: Publish verified release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release:publish
