name: Windows Shell Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-product:
    name: Windows product acceptance
    runs-on: windows-2022
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-artifacts
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned verification npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack acceptance artifact
        run: npm run release:pack

      - name: Prepare shared Windows product install
        run: npm run ci:prepare-windows-product

      - name: Platform-sensitive tests
        run: npm run ci:platform-tests

      - name: Packaged Windows product acceptance
        run: npm run windows:product-accept

  windows-shell:
    name: Windows shell acceptance (${{ matrix.name }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            script: pwsh:accept
          - name: Windows PowerShell 5.1
            script: powershell51:accept
          - name: cmd.exe
            script: cmd:accept
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-artifacts
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned verification npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack acceptance artifact
        run: npm run release:pack

      - name: Prepare Windows product install
        run: npm run ci:prepare-windows-product

      - name: Shell acceptance
        run: npm run ${{ matrix.script }}
