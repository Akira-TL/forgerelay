name: Windows Shell Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shell:
    name: Windows shell runtime acceptance
    runs-on: windows-2022
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-artifacts
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned verification npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack acceptance artifact
        run: npm run release:pack

      - name: Prepare shared Windows product install
        run: npm run ci:prepare-windows-product

      - name: Platform-sensitive tests
        run: npm run ci:platform-tests

      - name: PowerShell 7 acceptance
        run: npm run pwsh:accept

      - name: Windows PowerShell 5.1 acceptance
        run: npm run powershell51:accept

      - name: cmd.exe acceptance
        run: npm run cmd:accept

      - name: Packaged Windows product acceptance
        run: npm run windows:product-accept
