name: Windows Shell Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build acceptance npm artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned verification npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack acceptance artifact
        run: npm run release:pack

      - name: Upload acceptance artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-acceptance-package
          path: .release-artifacts/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  windows-platform:
    name: Windows platform tests (${{ matrix.shard }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime-process, workspace-filesystem]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned verification npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Platform-sensitive tests
        run: npm run ci:platform-tests -- ${{ matrix.shard }}

  windows-product:
    name: Windows product acceptance
    needs: package
    runs-on: windows-2022
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-artifacts
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned verification npm
        run: npm install --global npm@11.19.1

      - name: Download acceptance artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-acceptance-package
          path: .release-artifacts

      - name: Prepare Windows product install
        run: npm run ci:prepare-windows-product

      - name: Packaged Windows product acceptance
        run: npm run windows:product-accept

  windows-shell:
    name: Windows shell acceptance (${{ matrix.name }})
    needs: package
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            script: pwsh:accept
          - name: Windows PowerShell 5.1
            script: powershell51:accept
          - name: cmd.exe
            script: cmd:accept
    env:
      FORGERELAY_ACCEPTANCE_ARTIFACT_DIR: .release-artifacts
      FORGERELAY_ACCEPTANCE_PREFIX: .release-installed
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned verification npm
        run: npm install --global npm@11.19.1

      - name: Download acceptance artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-acceptance-package
          path: .release-artifacts

      - name: Prepare Windows product install
        run: npm run ci:prepare-windows-product

      - name: Shell acceptance
        run: npm run ${{ matrix.script }}
